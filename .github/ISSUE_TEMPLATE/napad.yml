name: Nápad nebo rozšíření
description: Nová funkce, vylepšení nebo podpora další platformy (Kodi, Plex, Jellyfin…)
labels: [nápad]
body:
  - type: textarea
    id: napad
    attributes:
      label: Co by se hodilo
      description: Popiš nápad a k čemu by ti pomohl.
    validations:
      required: true
  - type: dropdown
    id: oblast
    attributes:
      label: Oblast
      options:
        - Stremio addon
        - Jiná platforma (Kodi, Plex, Jellyfin, Emby…)
        - Konfigurační stránka
        - Nasazení a provoz
        - Jiné
  - type: textarea
    id: dalsi
    attributes:
      label: Cokoli dalšího
      description: Odkazy, příklady, jak to dělají jiné addony…
