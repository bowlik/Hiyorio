name: Chyba
description: Něco nefunguje, titulky se nenačetly nebo nesedí
labels: [chyba]
body:
  - type: markdown
    attributes:
      value: |
        Díky za nahlášení! **Nikdy sem nevkládej svůj API klíč ani odkaz na nainstalovaný addon** (je v něm klíč).
  - type: textarea
    id: popis
    attributes:
      label: Co se stalo
      description: Co jsi čekal a co se stalo místo toho.
    validations:
      required: true
  - type: input
    id: anime
    attributes:
      label: Anime a epizoda
      placeholder: např. Spy x Family, 1. sezóna, 5. epizoda
    validations:
      required: true
  - type: dropdown
    id: katalog
    attributes:
      label: Odkud jsi anime ve Stremiu pustil
      options:
        - Výchozí katalog Stremia (Cinemeta)
        - Anime Kitsu
        - Jiný addon
        - Nevím
  - type: dropdown
    id: zarizeni
    attributes:
      label: Zařízení
      options:
        - Stremio na počítači
        - Stremio na mobilu
        - Stremio na TV
        - Jiné
  - type: textarea
    id: log
    attributes:
      label: Výpis ze serveru (pokud addon provozuješ sám)
      description: Řádky z konzole nebo z logs/server.log. Zkontroluj, že v nich není klíč.
      render: text
